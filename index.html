<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1F8A83"><title>MEDORA</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<div id="lock" class="lock hidden"><form id="unlock"><h2>MEDORA</h2><p>أدخل رمز PIN</p><input id="pinInput" type="password" inputmode="numeric" maxlength="8" required><button class="primary">فتح التطبيق</button><small id="pinError"></small></form></div>
<div id="shell"><header><div class="brand"><b>+</b><span>MEDORA<small>PHARMACY MANAGEMENT</small><small id="today"></small></span></div><div><button id="theme" class="icon" aria-label="الوضع الداكن"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg></button><button id="settings" class="icon" aria-label="الإعدادات"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.1.9-1.5 2.6-1.4-.5a7.8 7.8 0 0 1-1.5.9l-.2 1.5h-3l-.3-1.5a7.8 7.8 0 0 1-1.5-.9l-1.4.5-1.5-2.6 1.1-.9a7.7 7.7 0 0 1 0-1.8l-1.1-.9 1.5-2.6 1.4.5a7.8 7.8 0 0 1 1.5-.9l.3-1.5h3l.2 1.5a7.8 7.8 0 0 1 1.5.9l1.4-.5 1.5 2.6-1.1.9a7.7 7.7 0 0 1 0 1.8Z"/></svg></button></div></header>
<main><section id="patients" class="view active"><div class="heading"><div><small>سجلات المراجعين</small><h1>المراجعون</h1><p>سجل الزيارات والوصفات لكل مراجع.</p></div><button id="newPatient" class="primary desktop">مراجع جديد +</button></div><div class="toolbar"><input id="patientSearch" placeholder="ابحث بالاسم أو الهاتف"><span id="patientCount"></span></div><div id="patientList" class="cards"></div><button id="newPatientFab" class="fab">+</button></section>
<section id="record" class="view"><button id="back" class="back">العودة إلى المراجعين ←</button><div id="recordContent"></div></section>
<section id="inventory" class="view"><div class="heading"><div><small>إدارة الأدوية</small><h1>المخزن</h1><p>تابع الكميات والصلاحية ومواقع الرفوف.</p></div><button id="newMedicine" class="primary desktop">إضافة دواء +</button></div><div id="expiry" class="expiry"></div><div class="toolbar"><input id="medicineSearch" placeholder="ابحث بالاسم التجاري أو العلمي"><button id="filters" class="secondary">الفلاتر</button></div><div id="filterPanel" class="filters hidden"><select id="status"><option value="">كل الحالات</option><option value="valid">صالح</option><option value="soon">قريب الانتهاء</option><option value="expired">منتهي</option><option value="archived">مؤرشف</option></select><select id="shelfFilter"><option value="">كل الرفوف</option></select><select id="formFilter"><option value="">كل الأشكال</option><option>أقراص</option><option>كبسولات</option><option>شراب</option><option>حقن</option><option>مرهم</option><option>قطرات</option><option>بخاخ</option><option>أخرى</option></select></div><div class="tabs"><button class="selected" data-sort="alpha">حسب الأبجدية</button><button data-sort="shelf">حسب الرف</button><button data-sort="expiry">حسب الانتهاء</button><button data-sort="shelves">الرفوف</button></div><div id="inventoryList"></div><button id="newMedicineFab" class="fab">+</button></section></main>
<nav><button class="nav selected" data-view="patients"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-4 2.7-6 6.5-6s6 2 6.5 6M17 5.5a3 3 0 0 1 0 5.8M17 14c2.7.2 4.2 2 4.5 5"/></svg><span>المراجعون</span></button><button class="nav" data-view="inventory"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></svg><span>المخزن</span></button></nav></div>
<dialog id="modal"><div id="modalBody"></div></dialog><div id="toast"></div><script src="app.js"></script></body></html>
